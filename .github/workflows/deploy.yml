name: Deploy Photo Notes to Azure

on:
  push:
    branches: [main]

env:
  AZURE_WEBAPP_NAME: photo-notes-app        # Change to your App Service name
  AZURE_STORAGE_ACCOUNT: photonotesstorage   # Change to your storage account name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Deploy static files to Azure Blob Storage ---
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload static files to Blob Storage
        uses: azure/cli@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name ${{ env.AZURE_STORAGE_ACCOUNT }} \
              --destination static/static \
              --source ./public \
              --overwrite true \
              --auth-mode login

      # --- Deploy web app to Azure App Service ---
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Azure Logout
        run: az logout
